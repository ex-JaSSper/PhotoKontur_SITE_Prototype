# Render Blueprint: статический сайт ФотоКонтур
services:
  - type: web
    name: photokontur-site
    runtime: static
    buildCommand: npx -y pnpm@11.25.0 install --frozen-lockfile && npx -y pnpm@11.25.0 build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
